name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # publish the APK as a release
  pages: write      # publish the web app
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install, test, and copy web files into the Android project
        run: |
          npm ci
          npm test
          npx cap sync android

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../ColorLife.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ColorLife-apk
          path: ColorLife.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Color Life 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ColorLife.apk
          body: |
            **Android:** download `ColorLife.apk` below and open it on your phone (allow "Install unknown apps" when asked).
            **iPhone:** open https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ in Safari → Share → Add to Home Screen.

  web:
    name: Web app (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Needs Settings → Pages → Source: "GitHub Actions" turned on once.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
